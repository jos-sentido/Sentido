<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Sentido</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #08080C;
      --surface:   #0D0D11;
      --surface2:  #13131A;
      --border:    #1F1F2A;
      --border2:   #2A2A38;
      --text:      #EDEAE4;
      --muted:     #7A7670;
      --faint:     #3A3830;
      --gold:      #C9B896;
      --gold-dim:  #6B5D43;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'Courier New', Menlo, monospace;
      --font-serif: Georgia, 'Times New Roman', serif;
      --s-enviada:      #55524E; --s-enviada-t:    #AAA39A;
      --s-presentada:   #3B6B9E; --s-presentada-t: #7EB8F5;
      --s-negociacion:  #8B7240; --s-negociacion-t:#C9A855;
      --s-ganada:       #2D6B4A; --s-ganada-t:     #5DC98A;
      --s-perdida:      #7A2B2B; --s-perdida-t:    #E88080;
      --s-archivada:    #2A2A38; --s-archivada-t:  #55524E;
      --s-borrador:     #2A2A38; --s-borrador-t:   #7A7670;
      --s-activo:       #2D6B4A; --s-activo-t:     #5DC98A;
      --s-archivado:    #1A1A22; --s-archivado-t:  #3A3830;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; }

    .view { display: none; min-height: 100vh; }
    .view.active { display: flex; }

    /* ── LOGIN ── */
    #view-login { align-items: center; justify-content: center; background: radial-gradient(ellipse 60% 50% at 50% 0%, #1A1A24 0%, var(--bg) 70%); }
    .login-box { width: 100%; max-width: 380px; padding: 48px 40px; background: var(--surface); border: 1px solid var(--border); }
    .login-logo { display: block; height: 32px; margin: 0 auto 40px; }
    .login-label { display: block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    .login-input { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border2); color: var(--text); font-family: var(--font-mono); font-size: 14px; outline: none; transition: border-color .15s; }
    .login-input:focus { border-color: var(--gold-dim); }
    .login-btn { display: block; width: 100%; margin-top: 20px; padding: 14px; background: var(--gold); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #1A1A1A; font-weight: 700; transition: opacity .15s; }
    .login-btn:hover { opacity: .85; }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; }
    .login-error { margin-top: 14px; padding: 10px 14px; background: #3A1515; border-left: 3px solid #7A2B2B; font-size: 13px; color: #E88080; display: none; }
    .login-error.show { display: block; }

    /* ── DASHBOARD ── */
    #view-dash { flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 20px; padding: 0 28px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .topbar-logo { height: 22px; }
    .topbar-sep { width: 1px; height: 20px; background: var(--border2); flex-shrink: 0; }
    .topbar-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .topbar-spacer { flex: 1; }
    .topbar-add { padding: 7px 16px; background: var(--gold); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #1A1A1A; font-weight: 700; transition: opacity .15s; }
    .topbar-add:hover { opacity: .85; }
    .topbar-logout { padding: 7px 14px; background: none; border: 1px solid var(--border2); cursor: pointer; font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); transition: border-color .15s, color .15s; }
    .topbar-logout:hover { border-color: var(--gold-dim); color: var(--text); }

    /* ── SECTION TABS ── */
    .section-tabs { display: flex; background: var(--surface2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .section-tab { padding: 14px 28px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); cursor: pointer; border: none; border-bottom: 2px solid transparent; background: none; transition: color .12s, border-color .12s; }
    .section-tab:hover { color: var(--text); }
    .section-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── STATS ── */
    .stats { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; scrollbar-width: none; }
    .stats::-webkit-scrollbar { display: none; }
    .stat { flex: 1; min-width: 80px; display: flex; flex-direction: column; align-items: center; padding: 14px 10px; border-right: 1px solid var(--border); cursor: pointer; transition: background .12s; }
    .stat:last-child { border-right: none; }
    .stat:hover, .stat.active { background: var(--surface2); }
    .stat-n { font-family: var(--font-serif); font-size: 24px; font-style: italic; color: var(--text); line-height: 1; margin-bottom: 5px; }
    .stat-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: center; }
    .stat.active .stat-n { color: var(--gold); }
    .stat.active .stat-label { color: var(--gold-dim); }

    .toolbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .search-wrap { position: relative; flex: 1; max-width: 320px; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-input { width: 100%; padding: 9px 12px 9px 36px; background: var(--surface); border: 1px solid var(--border2); color: var(--text); font-size: 13px; outline: none; transition: border-color .15s; }
    .search-input:focus { border-color: var(--gold-dim); }
    .search-input::placeholder { color: var(--muted); }
    .sort-select { padding: 9px 12px; background: var(--surface); border: 1px solid var(--border2); color: var(--text); font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; outline: none; }

    .grid { padding: 24px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-content: start; flex: 1; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 80px 0; color: var(--muted); font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }

    /* ── CARDS ── */
    .card { background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; transition: border-color .15s; }
    .card:hover { border-color: var(--border2); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 18px 12px; }
    .card-status { font-family: var(--font-mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; padding: 4px 8px; }
    .card-date { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
    .card-body { padding: 0 18px 16px; flex: 1; }
    .card-client { font-family: var(--font-serif); font-size: 20px; font-style: italic; color: var(--text); line-height: 1.15; margin-bottom: 12px; }
    .card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
    .card-services { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; min-height: 20px; }
    .tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border2); padding: 3px 7px; }
    .card-valor { font-family: var(--font-mono); font-size: 11px; color: var(--gold); margin-bottom: 10px; }
    .card-next { font-size: 12px; color: var(--muted); line-height: 1.45; padding-top: 10px; border-top: 1px solid var(--border); min-height: 38px; }
    .card-next-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 3px; }
    .card-foot { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--border); background: var(--surface2); }
    .card-seg { font-family: var(--font-mono); font-size: 10px; color: var(--muted); flex: 1; }
    .card-seg.urgent { color: #E88080; }
    .btn-ghost { padding: 6px 10px; background: none; border: 1px solid var(--border2); cursor: pointer; font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); transition: border-color .12s, color .12s; }
    .btn-ghost:hover { border-color: var(--gold-dim); color: var(--text); }

    /* status — propuestas */
    .s-enviada     { background: var(--s-enviada);     color: var(--s-enviada-t); }
    .s-presentada  { background: var(--s-presentada);  color: var(--s-presentada-t); }
    .s-negociacion { background: var(--s-negociacion); color: var(--s-negociacion-t); }
    .s-ganada      { background: var(--s-ganada);      color: var(--s-ganada-t); }
    .s-perdida     { background: var(--s-perdida);     color: var(--s-perdida-t); }
    .s-archivada   { background: var(--s-archivada);   color: var(--s-archivada-t); }
    /* status — comercial */
    .s-borrador    { background: var(--s-borrador);    color: var(--s-borrador-t); }
    .s-activo      { background: var(--s-activo);      color: var(--s-activo-t); }
    .s-archivado   { background: var(--s-archivado);   color: var(--s-archivado-t); }

    /* ── DRAWER ── */
    .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 100; }
    .drawer-overlay.open { display: block; }
    .drawer { position: fixed; top: 0; right: -560px; bottom: 0; width: 560px; max-width: 100vw; background: var(--surface); border-left: 1px solid var(--border); z-index: 101; display: flex; flex-direction: column; transition: right .22s cubic-bezier(.4,0,.2,1); overflow: hidden; }
    .drawer.open { right: 0; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .drawer-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .drawer-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px; }
    .drawer-close:hover { color: var(--text); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
    .drawer-foot { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); flex-shrink: 0; }

    .field { margin-bottom: 20px; }
    .field-label { display: block; margin-bottom: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .field-input, .field-select, .field-textarea { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border2); color: var(--text); font-size: 14px; font-family: var(--font-sans); outline: none; transition: border-color .15s; resize: vertical; }
    .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: var(--gold-dim); }
    .field-select { cursor: pointer; }
    .field-textarea { min-height: 80px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field-hint { margin-top: 5px; font-size: 11px; color: var(--muted); }
    .drawer-section { font-family: var(--font-mono); font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 18px; }

    /* ── SERVICES ── */
    .svc-group { margin-bottom: 16px; }
    .svc-group-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; display: block; }
    .svc-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; margin-bottom: 4px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; transition: border-color .12s, background .12s; user-select: none; }
    .svc-item:hover { border-color: var(--border2); background: var(--surface2); }
    .svc-item.checked { border-color: var(--gold-dim); background: rgba(201,184,150,.05); }
    .svc-item-left { display: flex; align-items: center; gap: 10px; }
    .svc-check { width: 14px; height: 14px; border: 1px solid var(--border2); background: var(--bg); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s; }
    .svc-item.checked .svc-check { background: var(--gold); border-color: var(--gold); }
    .svc-check-mark { display: none; font-size: 9px; color: #1A1A1A; font-weight: 700; }
    .svc-item.checked .svc-check-mark { display: block; }
    .svc-name { font-size: 13px; color: var(--text); }
    .svc-price { font-family: var(--font-mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .svc-item.checked .svc-price { color: var(--gold); }
    .svc-empty { font-size: 12px; color: var(--faint); font-style: italic; padding: 8px 0; }
    .svc-totals { display: flex; gap: 12px; margin-top: 14px; padding: 12px; background: var(--surface2); border: 1px solid var(--border); }
    .svc-total-item { flex: 1; }
    .svc-total-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .svc-total-val { font-family: var(--font-serif); font-size: 20px; font-style: italic; color: var(--gold); }
    .svc-total-val.zero { color: var(--faint); }
    .svc-potencial { display: flex; gap: 16px; margin-top: 8px; padding: 10px 12px; border: 1px dashed var(--border2); }
    .svc-potencial-col { flex: 1; }
    .svc-potencial-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
    .svc-potencial-val { font-family: var(--font-mono); font-size: 13px; color: var(--gold-dim); }
    .svc-potencial-val.zero { color: var(--border2); }
    .card-potencial { font-family: var(--font-mono); font-size: 10px; color: var(--gold-dim); margin-bottom: 10px; }

    /* ── BITÁCORA ── */
    .bitacora-form { background: var(--bg); border: 1px solid var(--border2); padding: 14px; margin-bottom: 16px; }
    .bitacora-form-title { font-family: var(--font-mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .bitacora-add-btn { margin-top: 10px; padding: 9px 16px; background: none; border: 1px solid var(--gold-dim); cursor: pointer; font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); transition: background .15s; }
    .bitacora-add-btn:hover { background: rgba(201,184,150,.08); }
    .bitacora-timeline { display: flex; flex-direction: column; }
    .bitacora-entry { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
    .bitacora-entry:last-child { padding-bottom: 0; }
    .bitacora-line { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; padding-top: 4px; }
    .bitacora-dot { width: 8px; height: 8px; border: 1px solid var(--gold-dim); background: var(--surface); flex-shrink: 0; }
    .bitacora-trail { flex: 1; width: 1px; background: var(--border); margin-top: 4px; }
    .bitacora-entry:last-child .bitacora-trail { display: none; }
    .bitacora-content { flex: 1; min-width: 0; }
    .bitacora-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .bitacora-fecha { font-family: var(--font-mono); font-size: 10px; color: var(--gold-dim); }
    .bitacora-del { background: none; border: none; cursor: pointer; color: var(--faint); font-size: 14px; padding: 0; line-height: 1; margin-left: auto; transition: color .1s; }
    .bitacora-del:hover { color: var(--s-perdida-t); }
    .bitacora-paso { font-size: 13px; color: var(--text); margin-bottom: 4px; font-weight: 500; }
    .bitacora-notas { font-size: 12px; color: var(--muted); line-height: 1.5; white-space: pre-wrap; }
    .bitacora-empty { font-size: 12px; color: var(--faint); font-style: italic; }

    /* ── DRAWER FOOTER ── */
    .btn-save { flex: 1; padding: 12px; background: var(--gold); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #1A1A1A; font-weight: 700; transition: opacity .15s; }
    .btn-save:hover { opacity: .85; }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel { padding: 12px 20px; background: none; border: 1px solid var(--border2); cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); transition: border-color .15s, color .15s; }
    .btn-cancel:hover { border-color: var(--gold-dim); color: var(--text); }
    .btn-danger { padding: 12px 16px; background: none; border: 1px solid var(--s-perdida); cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--s-perdida-t); transition: background .15s; }
    .btn-danger:hover { background: var(--s-perdida); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border2); padding: 12px 24px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--text); z-index: 200; transition: transform .25s cubic-bezier(.4,0,.2,1), opacity .25s; opacity: 0; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--s-perdida); color: var(--s-perdida-t); }

    #view-loading { align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

    @media (max-width: 600px) {
      .topbar { padding: 0 16px; }
      .section-tab { padding: 12px 16px; }
      .toolbar, .grid { padding: 12px 16px; }
      .drawer { width: 100vw; }
      .field-row { grid-template-columns: 1fr; }
      .svc-totals { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

<div id="view-loading" class="view active">
  <div class="spinner"></div>
  <p class="loading-text">Cargando</p>
</div>

<div id="view-login" class="view">
  <div class="login-box">
    <img src="https://propuestas.sentido.mx/assets/logo-sentido-light.png" alt="Sentido" class="login-logo">
    <label class="login-label">Contraseña</label>
    <input type="password" id="login-pw" class="login-input" placeholder="••••••••••••" autocomplete="current-password">
    <button id="login-btn" class="login-btn">Entrar</button>
    <div id="login-error" class="login-error">Contraseña incorrecta</div>
  </div>
</div>

<div id="view-dash" class="view">
  <header class="topbar">
    <img src="https://propuestas.sentido.mx/assets/logo-sentido-light.png" alt="Sentido" class="topbar-logo">
    <div class="topbar-sep"></div>
    <span class="topbar-title" id="topbar-title">Propuestas a prospectos</span>
    <div class="topbar-spacer"></div>
    <button class="topbar-add" id="btn-new">+ Nuevo</button>
    <button class="topbar-logout" id="btn-logout">Salir</button>
  </header>

  <div class="section-tabs" id="section-tabs">
    <button class="section-tab active" data-tipo="propuesta">Propuestas a prospectos</button>
    <button class="section-tab" data-tipo="cliente">Clientes activos</button>
    <button class="section-tab" data-tipo="comercial">Activos comerciales</button>
  </div>

  <div class="stats" id="stats-bar"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" class="search-input" placeholder="Buscar…">
    </div>
    <select id="sort-select" class="sort-select">
      <option value="fecha-desc">Más reciente</option>
      <option value="fecha-asc">Más antiguo</option>
      <option value="cliente">Cliente A–Z</option>
      <option value="valor-desc">Mayor potencial</option>
    </select>
  </div>

  <div class="grid" id="proposal-grid"></div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title" id="drawer-title">Nuevo registro</span>
    <button class="drawer-close" id="drawer-close">×</button>
  </div>
  <div class="drawer-body">

    <p class="drawer-section">Identificación</p>
    <div class="field">
      <label class="field-label">Slug / URL</label>
      <input type="text" id="f-slug" class="field-input" placeholder="nombre-del-slug">
      <p class="field-hint" id="slug-hint">…</p>
    </div>
    <div class="field">
      <label class="field-label">Nombre</label>
      <input type="text" id="f-cliente" class="field-input" placeholder="Nombre del cliente o activo">
    </div>
    <div class="field" id="f-desc-wrap" style="display:none">
      <label class="field-label">Descripción breve</label>
      <input type="text" id="f-descripcion" class="field-input" placeholder="Ej. Presentación comercial para desarrolladores">
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label">Fecha</label>
        <input type="date" id="f-fecha" class="field-input">
      </div>
      <div class="field">
        <label class="field-label">Estatus</label>
        <select id="f-estatus" class="field-select"></select>
      </div>
    </div>

    <!-- SERVICIOS (solo propuestas) -->
    <div id="svc-section">
      <p class="drawer-section" style="margin-top:8px">Servicios cotizados</p>
      <div id="svc-list"></div>
      <div class="svc-totals">
        <div class="svc-total-item">
          <div class="svc-total-label">Mensual</div>
          <div class="svc-total-val zero" id="total-mensual">$0</div>
        </div>
        <div class="svc-total-item">
          <div class="svc-total-label">Setup / Único</div>
          <div class="svc-total-val zero" id="total-unico">$0</div>
        </div>
      </div>
      <div class="svc-potencial" id="svc-potencial">
        <div class="svc-potencial-col">
          <div class="svc-potencial-label">Potencial mensual</div>
          <div class="svc-potencial-val zero" id="potencial-mensual">$0</div>
        </div>
        <div class="svc-potencial-col">
          <div class="svc-potencial-label">Potencial setup</div>
          <div class="svc-potencial-val zero" id="potencial-unico">$0</div>
        </div>
      </div>
    </div>

    <!-- NOTAS (ambos) -->
    <div style="margin-top:24px">
      <p class="drawer-section">Notas</p>
      <div class="field" style="margin:0">
        <textarea id="f-notas" class="field-textarea" placeholder="Contexto, observaciones…"></textarea>
      </div>
    </div>

    <!-- BITÁCORA (solo propuestas) -->
    <div id="bitacora-section" style="margin-top:24px">
      <p class="drawer-section">Seguimiento</p>
      <div class="bitacora-form">
        <div class="bitacora-form-title">Nueva entrada</div>
        <div class="field-row" style="margin-bottom:10px">
          <div class="field" style="margin:0">
            <label class="field-label">Fecha</label>
            <input type="date" id="b-fecha" class="field-input">
          </div>
          <div class="field" style="margin:0">
            <label class="field-label">Próximo paso</label>
            <input type="text" id="b-proximo" class="field-input" placeholder="Ej. Llamada de cierre">
          </div>
        </div>
        <div class="field" style="margin:0">
          <label class="field-label">Notas</label>
          <textarea id="b-notas" class="field-textarea" style="min-height:60px" placeholder="Contexto, objeciones, acuerdos…"></textarea>
        </div>
        <button class="bitacora-add-btn" id="btn-add-entry">+ Agregar entrada</button>
      </div>
      <div class="bitacora-timeline" id="bitacora-timeline"></div>
    </div>

  </div>
  <div class="drawer-foot">
    <button class="btn-cancel" id="btn-cancel">Cancelar</button>
    <button class="btn-danger" id="btn-delete" style="display:none">Eliminar</button>
    <button class="btn-save" id="btn-save">Guardar</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function () {
'use strict';

// ── STATE ────────────────────────────────────────────────
let proposals = [];
let sha = null;
let currentTipo = 'propuesta';
let filter = 'all', query = '', sort = 'fecha-desc';
let editingSlug = null;
let currentBitacora = [];

// ── CONFIG BY TIPO ────────────────────────────────────────
const TIPOS = {
  propuesta: {
    label:   'Propuestas a prospectos',
    urlBase: 'propuestas.sentido.mx/',
    statuses: [
      { value: 'enviada',        label: 'Enviada',        cls: 's-enviada' },
      { value: 'presentada',      label: 'Presentada',     cls: 's-presentada' },
      { value: 'en negociación', label: 'En negociación', cls: 's-negociacion' },
      { value: 'ganada',         label: 'Ganada',         cls: 's-ganada' },
      { value: 'perdida',        label: 'Perdida',        cls: 's-perdida' },
      { value: 'archivada',      label: 'Archivada',      cls: 's-archivada' },
    ],
    stats: [
      { key: 'all',            label: 'Total' },
      { key: 'enviada',        label: 'Enviadas' },
      { key: 'presentada',     label: 'Presentadas' },
      { key: 'en negociación', label: 'Negociando' },
      { key: 'ganada',         label: 'Ganadas' },
      { key: 'perdida',        label: 'Perdidas' },
      { key: 'archivada',      label: 'Archivadas' },
    ],
  },
  cliente: {
    label:   'Clientes activos',
    urlBase: 'propuestas.sentido.mx/',
    statuses: [
      { value: 'enviada',        label: 'Enviada',        cls: 's-enviada' },
      { value: 'en producción',  label: 'En producción',  cls: 's-activo' },
      { value: 'activa',         label: 'Activa',         cls: 's-activo' },
      { value: 'en negociación', label: 'En negociación', cls: 's-negociacion' },
      { value: 'ganada',         label: 'Ganada',         cls: 's-ganada' },
      { value: 'pausada',        label: 'Pausada',        cls: 's-archivada' },
      { value: 'archivada',      label: 'Archivada',      cls: 's-archivada' },
    ],
    stats: [
      { key: 'all',           label: 'Total' },
      { key: 'enviada',       label: 'Enviadas' },
      { key: 'en producción', label: 'En producción' },
      { key: 'activa',        label: 'Activas' },
      { key: 'ganada',        label: 'Ganadas' },
      { key: 'pausada',       label: 'Pausadas' },
      { key: 'archivada',     label: 'Archivadas' },
    ],
  },
  comercial: {
    label:   'Activos comerciales',
    urlBase: 'propuestas.sentido.mx/comercial/',
    statuses: [
      { value: 'borrador',  label: 'Borrador',  cls: 's-borrador' },
      { value: 'activo',    label: 'Activo',    cls: 's-activo' },
      { value: 'archivado', label: 'Archivado', cls: 's-archivado' },
    ],
    stats: [
      { key: 'all',       label: 'Total' },
      { key: 'activo',    label: 'Activos' },
      { key: 'borrador',  label: 'Borradores' },
      { key: 'archivado', label: 'Archivados' },
    ],
  },
};

function cfg() { return TIPOS[currentTipo]; }

function statusCls(s) {
  for (const t of Object.values(TIPOS)) {
    const found = t.statuses.find(x => x.value === s);
    if (found) return found.cls;
  }
  return 's-archivada';
}
function statusLabel(s) {
  for (const t of Object.values(TIPOS)) {
    const found = t.statuses.find(x => x.value === s);
    if (found) return found.label;
  }
  return s;
}

// ── VIEWS ─────────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── BOOT ──────────────────────────────────────────────────
async function boot() {
  showView('view-loading');
  try {
    const res = await apiFetch('GET', '/api/admin-proposals');
    if (res.status === 401) { showView('view-login'); return; }
    if (!res.ok) throw new Error();
    const data = await res.json();
    proposals = data.proposals || [];
    sha = data._sha || null;
    render();
    showView('view-dash');
  } catch { showView('view-login'); }
}

// ── AUTH ──────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw  = document.getElementById('login-pw').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  err.classList.remove('show'); btn.disabled = true; btn.textContent = 'Verificando…';
  try {
    const res = await apiFetch('POST', '/api/admin-login', { password: pw });
    if (res.ok) { await boot(); }
    else { err.classList.add('show'); btn.disabled = false; btn.textContent = 'Entrar'; }
  } catch { err.classList.add('show'); btn.disabled = false; btn.textContent = 'Entrar'; }
}

document.getElementById('btn-logout').addEventListener('click', async () => {
  await apiFetch('POST', '/api/admin-logout');
  proposals = []; sha = null;
  document.getElementById('login-pw').value = '';
  showView('view-login');
});

// ── SECTION TABS ──────────────────────────────────────────
document.getElementById('section-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.section-tab'); if (!tab) return;
  document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTipo = tab.dataset.tipo;
  filter = 'all'; query = '';
  document.getElementById('search-input').value = '';
  document.getElementById('topbar-title').textContent = cfg().label;
  render();
});

// ── RENDER ────────────────────────────────────────────────
function render() { buildStats(); renderGrid(); }

function buildStats() {
  const bar   = document.getElementById('stats-bar');
  const items = proposals.filter(p => (p.tipo || 'propuesta') === currentTipo);
  const c = { all: items.length };
  items.forEach(p => { c[p.estatus] = (c[p.estatus] || 0) + 1; });
  bar.innerHTML = cfg().stats.map(s => {
    const active = (filter === s.key) ? ' active' : '';
    return `<div class="stat${active}" data-filter="${esc(s.key)}"><span class="stat-n">${c[s.key] || 0}</span><span class="stat-label">${esc(s.label)}</span></div>`;
  }).join('');
  bar.querySelectorAll('.stat').forEach(st => {
    st.addEventListener('click', () => { filter = st.dataset.filter; render(); });
  });
}

function filtered() {
  return proposals
    .filter(p => {
      if ((p.tipo || 'propuesta') !== currentTipo) return false;
      if (filter !== 'all' && p.estatus !== filter) return false;
      if (query) {
        const q = query.toLowerCase();
        if (!p.cliente.toLowerCase().includes(q) && !p.slug.toLowerCase().includes(q)) return false;
      }
      return true;
    })
    .sort((a, b) => {
      if (sort === 'fecha-desc') return (b.fecha||'').localeCompare(a.fecha||'');
      if (sort === 'fecha-asc')  return (a.fecha||'').localeCompare(b.fecha||'');
      if (sort === 'cliente')    return a.cliente.localeCompare(b.cliente);
      if (sort === 'valor-desc') return calcPotencialMensual(b) - calcPotencialMensual(a);
      return 0;
    });
}

function calcMensual(p) {
  if (!p.serviciosDisponibles || !p.serviciosSeleccionados) return 0;
  return p.serviciosDisponibles.filter(s => s.tipo === 'mensual' && p.serviciosSeleccionados.includes(s.id)).reduce((a,s) => a+s.precio, 0);
}
function calcUnico(p) {
  if (!p.serviciosDisponibles || !p.serviciosSeleccionados) return 0;
  return p.serviciosDisponibles.filter(s => s.tipo === 'unico' && p.serviciosSeleccionados.includes(s.id)).reduce((a,s) => a+s.precio, 0);
}
function calcPotencialMensual(p) {
  return (p.serviciosDisponibles||[]).filter(s => s.tipo === 'mensual').reduce((a,s) => a+s.precio, 0);
}
function calcPotencialUnico(p) {
  return (p.serviciosDisponibles||[]).filter(s => s.tipo === 'unico').reduce((a,s) => a+s.precio, 0);
}

function renderGrid() {
  const grid = document.getElementById('proposal-grid');
  const list = filtered();
  if (!list.length) { grid.innerHTML = '<p class="empty">Sin registros</p>'; return; }
  grid.innerHTML = list.map(p => currentTipo === 'comercial' ? cardComercialHTML(p) : cardHTML(p)).join('');
  grid.querySelectorAll('.card').forEach(card => {
    card.querySelector('.btn-edit').addEventListener('click', () => openDrawer(card.dataset.slug));
    const lb = card.querySelector('.btn-link');
    if (lb) lb.addEventListener('click', () => window.open(`https://${cfg().urlBase}${card.dataset.slug}`, '_blank'));
  });
}

function cardHTML(p) {
  const mensual = calcMensual(p), unico = calcUnico(p);
  const potMensual = calcPotencialMensual(p), potUnico = calcPotencialUnico(p);
  const selSvcs = (p.serviciosDisponibles||[]).filter(s => (p.serviciosSeleccionados||[]).includes(s.id));
  const tagsHtml = selSvcs.map(s => `<span class="tag">${esc(s.nombre)}</span>`).join('') || '<span style="font-size:11px;color:var(--faint)">Sin servicios seleccionados</span>';
  let valorHtml = '';
  if (mensual || unico) {
    valorHtml = `<p class="card-valor">`;
    if (mensual) valorHtml += `${fmtMXN(mensual)} <span style="opacity:.5">/ mes</span>`;
    if (mensual && unico) valorHtml += ` <span style="opacity:.35">+</span> `;
    if (unico)   valorHtml += `${fmtMXN(unico)} <span style="opacity:.5">único</span>`;
    valorHtml += ` <span style="opacity:.4">+ IVA</span></p>`;
  }
  let potencialHtml = '';
  if (potMensual || potUnico) {
    potencialHtml = `<p class="card-potencial">Potencial `;
    if (potMensual) potencialHtml += `${fmtMXN(potMensual)}<span style="opacity:.6">/mes</span>`;
    if (potMensual && potUnico) potencialHtml += ` + `;
    if (potUnico)   potencialHtml += `${fmtMXN(potUnico)}<span style="opacity:.6"> único</span>`;
    potencialHtml += `</p>`;
  }
  const last = (p.bitacora||[])[0];
  const nextHtml = last?.proximoPaso ? `<div class="card-next"><span class="card-next-label">Próximo paso</span>${esc(last.proximoPaso)}</div>` : '';
  const seg = last?.fecha ? `<span class="card-seg${isUrgent(last.fecha)?' urgent':''}">Seg. ${fmtDate(last.fecha)}</span>` : '<span class="card-seg"></span>';
  return `<div class="card" data-slug="${esc(p.slug)}">
    <div class="card-head"><span class="card-status ${statusCls(p.estatus)}">${statusLabel(p.estatus)}</span><span class="card-date">${fmtDate(p.fecha)}</span></div>
    <div class="card-body"><p class="card-client">${esc(p.cliente)}</p><div class="card-services">${tagsHtml}</div>${valorHtml}${potencialHtml}${nextHtml}</div>
    <div class="card-foot">${seg}<button class="btn-ghost btn-link">Ver →</button><button class="btn-ghost btn-edit">Editar</button></div>
  </div>`;
}

function cardComercialHTML(p) {
  const descHtml = p.descripcion ? `<p class="card-desc">${esc(p.descripcion)}</p>` : '';
  return `<div class="card" data-slug="${esc(p.slug)}">
    <div class="card-head"><span class="card-status ${statusCls(p.estatus)}">${statusLabel(p.estatus)}</span><span class="card-date">${fmtDate(p.fecha)}</span></div>
    <div class="card-body"><p class="card-client">${esc(p.cliente)}</p>${descHtml}</div>
    <div class="card-foot"><span class="card-seg"></span><button class="btn-ghost btn-link">Ver →</button><button class="btn-ghost btn-edit">Editar</button></div>
  </div>`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso) { if (!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d} ${'ene feb mar abr may jun jul ago sep oct nov dic'.split(' ')[+m-1]} ${y}`; }
function fmtMXN(n) { return '$' + Number(n).toLocaleString('es-MX'); }
function isUrgent(iso) { if (!iso) return false; return (new Date(iso+'T00:00:00') - new Date()) / 86400000 <= 2; }
function today() { return new Date().toISOString().slice(0,10); }

// ── FILTERS ───────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => { query = e.target.value.trim(); renderGrid(); });
document.getElementById('sort-select').addEventListener('change', e => { sort = e.target.value; renderGrid(); });

// ── DRAWER ────────────────────────────────────────────────
function openDrawer(slug) {
  editingSlug = slug || null;
  const isNew = !slug;
  const p = slug ? proposals.find(x => x.slug === slug) : null;
  const tipo = p ? (p.tipo || 'propuesta') : currentTipo;
  const isCom = tipo === 'comercial';

  document.getElementById('drawer-title').textContent = isNew
    ? (isCom ? 'Nuevo activo comercial' : 'Nueva propuesta')
    : (isCom ? 'Editar activo comercial' : 'Editar propuesta');

  document.getElementById('btn-delete').style.display = isNew ? 'none' : 'block';
  document.getElementById('f-slug').value    = p ? p.slug : '';
  document.getElementById('f-slug').disabled = !isNew;
  document.getElementById('f-cliente').value = p ? p.cliente : '';
  document.getElementById('f-fecha').value   = p ? (p.fecha || today()) : today();
  document.getElementById('f-notas').value   = p ? (p.notas || '') : '';

  document.getElementById('slug-hint').textContent = `propuestas.sentido.mx/${isCom ? 'comercial/' : ''}${p ? p.slug : '…'}`;

  document.getElementById('f-desc-wrap').style.display     = isCom ? 'block' : 'none';
  document.getElementById('f-descripcion').value           = p ? (p.descripcion || '') : '';
  document.getElementById('svc-section').style.display     = isCom ? 'none' : 'block';
  document.getElementById('bitacora-section').style.display = isCom ? 'none' : 'block';

  const sel = document.getElementById('f-estatus');
  sel.innerHTML = cfg().statuses.map(s => `<option value="${esc(s.value)}">${esc(s.label)}</option>`).join('');
  sel.value = p ? p.estatus : cfg().statuses[0].value;

  if (!isCom) {
    currentBitacora = p ? [...(p.bitacora || [])] : [];
    renderSvcList(p);
    renderBitacora();
    resetBitacoraForm();
  }

  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('f-cliente').focus();
}

function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  editingSlug = null;
}

document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('btn-cancel').addEventListener('click', closeDrawer);
document.getElementById('btn-new').addEventListener('click', () => openDrawer(null));
document.getElementById('f-slug').addEventListener('input', e => {
  const isCom = currentTipo === 'comercial';
  document.getElementById('slug-hint').textContent = `propuestas.sentido.mx/${isCom ? 'comercial/' : ''}${e.target.value || '…'}`;
});

// ── SERVICES ──────────────────────────────────────────────
function renderSvcList(p) {
  const container     = document.getElementById('svc-list');
  const disponibles   = p ? (p.serviciosDisponibles || []) : [];
  const seleccionados = p ? (p.serviciosSeleccionados || []) : [];
  if (!disponibles.length) {
    container.innerHTML = '<p class="svc-empty">Esta propuesta no tiene servicios registrados.</p>';
    updateTotals([]); return;
  }
  const mensual = disponibles.filter(s => s.tipo === 'mensual');
  const unico   = disponibles.filter(s => s.tipo === 'unico');
  let html = '';
  if (mensual.length) html += `<div class="svc-group"><span class="svc-group-label">Mensuales</span>${mensual.map(s => svcItemHTML(s, seleccionados.includes(s.id))).join('')}</div>`;
  if (unico.length)   html += `<div class="svc-group"><span class="svc-group-label">Única vez (setup)</span>${unico.map(s => svcItemHTML(s, seleccionados.includes(s.id))).join('')}</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.svc-item').forEach(item => {
    item.addEventListener('click', () => { item.classList.toggle('checked'); updateTotals(getCheckedIds()); });
  });
  updateTotals(seleccionados);
  const pm = disponibles.filter(s => s.tipo === 'mensual').reduce((a,s) => a+s.precio, 0);
  const pu = disponibles.filter(s => s.tipo === 'unico').reduce((a,s) => a+s.precio, 0);
  const elPM = document.getElementById('potencial-mensual'), elPU = document.getElementById('potencial-unico');
  elPM.textContent = fmtMXN(pm); elPM.className = 'svc-potencial-val' + (pm ? '' : ' zero');
  elPU.textContent = fmtMXN(pu); elPU.className = 'svc-potencial-val' + (pu ? '' : ' zero');
}

function svcItemHTML(s, checked) {
  const freq = s.tipo === 'mensual' ? '/mes' : 'único';
  return `<div class="svc-item${checked?' checked':''}" data-id="${esc(s.id)}">
    <div class="svc-item-left"><div class="svc-check"><span class="svc-check-mark">✓</span></div><span class="svc-name">${esc(s.nombre)}</span></div>
    <span class="svc-price">${fmtMXN(s.precio)} <span style="opacity:.6">${freq}</span></span>
  </div>`;
}

function getCheckedIds() { return [...document.querySelectorAll('.svc-item.checked')].map(el => el.dataset.id); }

function updateTotals(selectedIds) {
  const p = editingSlug ? proposals.find(x => x.slug === editingSlug) : null;
  const disponibles = p ? (p.serviciosDisponibles || []) : [];
  const ids = Array.isArray(selectedIds) ? selectedIds : getCheckedIds();
  let mensual = 0, unico = 0;
  disponibles.forEach(s => { if (ids.includes(s.id)) { if (s.tipo === 'mensual') mensual += s.precio; else unico += s.precio; } });
  const elM = document.getElementById('total-mensual'), elU = document.getElementById('total-unico');
  elM.textContent = fmtMXN(mensual); elM.className = 'svc-total-val' + (mensual ? '' : ' zero');
  elU.textContent = fmtMXN(unico);   elU.className = 'svc-total-val' + (unico   ? '' : ' zero');
}

// ── BITÁCORA ──────────────────────────────────────────────
function resetBitacoraForm() {
  document.getElementById('b-fecha').value   = today();
  document.getElementById('b-proximo').value = '';
  document.getElementById('b-notas').value   = '';
}

function renderBitacora() {
  const container = document.getElementById('bitacora-timeline');
  if (!currentBitacora.length) { container.innerHTML = '<p class="bitacora-empty">Sin entradas todavía.</p>'; return; }
  container.innerHTML = currentBitacora.map((e, i) => `
    <div class="bitacora-entry">
      <div class="bitacora-line"><div class="bitacora-dot"></div><div class="bitacora-trail"></div></div>
      <div class="bitacora-content">
        <div class="bitacora-meta"><span class="bitacora-fecha">${fmtDate(e.fecha)}</span><button class="bitacora-del" data-idx="${i}">×</button></div>
        ${e.proximoPaso ? `<div class="bitacora-paso">${esc(e.proximoPaso)}</div>` : ''}
        ${e.notas       ? `<div class="bitacora-notas">${esc(e.notas)}</div>` : ''}
      </div>
    </div>`).join('');
  container.querySelectorAll('.bitacora-del').forEach(btn => {
    btn.addEventListener('click', () => { currentBitacora.splice(+btn.dataset.idx, 1); renderBitacora(); });
  });
}

document.getElementById('btn-add-entry').addEventListener('click', () => {
  const fecha   = document.getElementById('b-fecha').value;
  const proximo = document.getElementById('b-proximo').value.trim();
  const notas   = document.getElementById('b-notas').value.trim();
  if (!fecha && !proximo && !notas) return showToast('Completa al menos un campo', true);
  currentBitacora.unshift({ fecha: fecha || today(), proximoPaso: proximo, notas, creadoEn: new Date().toISOString() });
  renderBitacora(); resetBitacoraForm();
});

// ── SAVE ──────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', saveDrawer);

async function saveDrawer() {
  const slug    = document.getElementById('f-slug').value.trim().toLowerCase().replace(/\s+/g,'-');
  const cliente = document.getElementById('f-cliente').value.trim();
  if (!slug)    return showToast('El slug es requerido', true);
  if (!cliente) return showToast('El nombre es requerido', true);

  const isNew = !editingSlug;
  if (isNew && proposals.find(p => p.slug === slug)) return showToast('Ya existe ese slug', true);

  const existente = editingSlug ? proposals.find(p => p.slug === editingSlug) : null;
  const tipo = existente ? (existente.tipo || 'propuesta') : currentTipo;
  const isCom = tipo === 'comercial';

  const updated = {
    slug, tipo, cliente,
    fecha:   document.getElementById('f-fecha').value || null,
    estatus: document.getElementById('f-estatus').value,
    ...(isCom ? {
      descripcion:            document.getElementById('f-descripcion').value.trim(),
      notas:                  document.getElementById('f-notas').value,
      serviciosDisponibles:   [],
      serviciosSeleccionados: [],
      bitacora:               [],
    } : {
      serviciosDisponibles:   existente?.serviciosDisponibles || [],
      serviciosSeleccionados: getCheckedIds(),
      notas:                  document.getElementById('f-notas').value,
      proximoPaso:            '',
      fechaSeguimiento:       null,
      bitacora:               currentBitacora,
    })
  };

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const next = isNew ? [...proposals, updated] : proposals.map(p => p.slug === editingSlug ? updated : p);
    const res  = await apiFetch('PUT', '/api/admin-proposals', { proposals: next, _sha: sha });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    sha = data._sha || sha; proposals = next;
    render(); closeDrawer(); showToast('Guardado ✓');
  } catch { showToast('Error al guardar', true); }
  finally { btn.disabled = false; btn.textContent = 'Guardar'; }
}

// ── DELETE ────────────────────────────────────────────────
document.getElementById('btn-delete').addEventListener('click', async () => {
  if (!editingSlug) return;
  if (!confirm(`¿Eliminar "${editingSlug}"?`)) return;
  const btn = document.getElementById('btn-delete'); btn.disabled = true;
  try {
    const next = proposals.filter(p => p.slug !== editingSlug);
    const res  = await apiFetch('PUT', '/api/admin-proposals', { proposals: next, _sha: sha });
    if (!res.ok) throw new Error();
    const data = await res.json();
    sha = data._sha || sha; proposals = next;
    render(); closeDrawer(); showToast('Eliminado');
  } catch { showToast('Error al eliminar', true); }
  finally { btn.disabled = false; }
});

// ── TOAST ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isError) {
  const el = document.getElementById('toast');
  clearTimeout(toastTimer);
  el.textContent = msg; el.className = 'toast' + (isError ? ' error' : '');
  void el.offsetWidth; el.classList.add('show');
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

async function apiFetch(method, url, body) {
  return fetch(url, { method, headers: body ? {'Content-Type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
}

boot();
})();
</script>
