<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de Pauta - PLP Desarrollos</title>
<style>
:root{
--color-background-primary:#ffffff;
--color-background-secondary:#f5f5f4;
--color-background-tertiary:#fafaf9;
--color-text-primary:#1c1917;
--color-text-secondary:#78716c;
--color-text-tertiary:#a8a29e;
--color-border-tertiary:rgba(0,0,0,0.15);
--color-border-primary:rgba(0,0,0,0.4);
--color-border-secondary:rgba(0,0,0,0.3);
--border-radius-md:8px;
--border-radius-lg:12px;
--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media(prefers-color-scheme:dark){
:root{
--color-background-primary:#1c1917;
--color-background-secondary:#292524;
--color-background-tertiary:#0a0908;
--color-text-primary:#fafaf9;
--color-text-secondary:#a8a29e;
--color-text-tertiary:#78716c;
--color-border-tertiary:rgba(255,255,255,0.15);
--color-border-primary:rgba(255,255,255,0.4);
--color-border-secondary:rgba(255,255,255,0.3);
}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-tertiary);color:var(--color-text-primary);padding:2rem;max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;margin-bottom:1.75rem}
.brand img{height:64px;width:auto;display:block}
.brand .logo-light{display:block}
.brand .logo-dark{display:none}
@media(prefers-color-scheme:dark){
.brand .logo-light{display:none}
.brand .logo-dark{display:block}
}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.subtitle{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.5rem}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:14px}
.pname{font-size:16px;font-weight:500;margin:0 0 2px}
.psub{font-size:12px;color:var(--color-text-secondary);margin:0 0 14px}
.sbar-wrap{position:relative;height:36px;border-radius:6px;overflow:visible;margin:0 0 8px;user-select:none;-webkit-user-select:none;cursor:pointer}
.sbar-seg{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;pointer-events:none;overflow:hidden;white-space:nowrap}
.handle{position:absolute;top:-2px;width:4px;height:40px;background:var(--color-background-primary);border:1.5px solid var(--color-border-primary);border-radius:3px;cursor:col-resize;z-index:10;touch-action:none}
.handle:hover{background:var(--color-background-secondary);border-color:var(--color-text-primary)}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:0;padding:5px 0;font-size:12px;border-bottom:0.5px solid var(--color-border-tertiary)}
.prow-h{font-size:11px;color:var(--color-text-secondary);font-weight:500;border-bottom:0.5px solid var(--color-border-tertiary);padding:0 0 4px;margin-bottom:2px}
.r{text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 1.5rem;font-size:12px;color:var(--color-text-secondary)}
.legend span{display:flex;align-items:center;gap:4px}
.ldot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.pct-display{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px;font-size:12px}
.pct-item{display:flex;align-items:center;gap:4px}
.pct-val{font-weight:500;min-width:28px}
.hint{font-size:11px;color:var(--color-text-tertiary);margin:0 0 6px;font-style:italic}
</style>
</head>
<body>

<div class="brand">
<img class="logo-light" src="/assets/logo-sentido-dark.png" alt="Sentido">
<img class="logo-dark" src="/assets/logo-sentido-light.png" alt="Sentido">
</div>

<h1>Distribución de pauta por desarrollo</h1>
<p class="subtitle">Arrastra las líneas para ajustar la distribución entre canales</p>

<div class="legend">
<span><span class="ldot" style="background:#378ADD"></span>Google Ads</span>
<span><span class="ldot" style="background:#7F77DD"></span>Meta captación</span>
<span><span class="ldot" style="background:#D85A30"></span>Landing Pages GHL</span>
<span><span class="ldot" style="background:#1D9E75"></span>Remarketing</span>
</div>

<div id="projects"></div>

<script>
var C={g:"#378ADD",m:"#7F77DD",l:"#D85A30",r:"#1D9E75"};
var CT={g:"#185FA5",m:"#534AB7",l:"#993C1D",r:"#0F6E56"};

var projects=[
{name:"Bolongo Punta de Mita",current:"$30,000",pcts:[15,50,20,15],periods:[
{label:"May–Jun",total:87500},{label:"Q3 (Jul–Sep)",total:100000},{label:"Q4 (Oct–Dic)",total:100000}]},
{name:"Amancay Nuevo Vallarta",current:"$30,000",pcts:[15,50,20,15],periods:[
{label:"May–Jun",total:62500},{label:"Q3 (Jul–Sep)",total:78125},{label:"Q4 (Oct–Dic)",total:97656}]},
{name:"Essentia Country",current:"$30,000",pcts:[15,50,20,15],periods:[
{label:"May–Jun",total:50000},{label:"Q3 (Jul–Sep)",total:55000},{label:"Q4 (Oct–Dic)",total:60000}]},
{name:"Brelia Residences",current:"$25,000",pcts:[15,50,20,15],periods:[
{label:"May–Jun",total:45000},{label:"Q3 (Jul–Sep)",total:55000},{label:"Q4 (Oct–Dic)",total:65000}]}
];

var fmt=function(n){return "$"+Math.round(n).toLocaleString("en-US")};
var container=document.getElementById("projects");
var MIN=5;

projects.forEach(function(p,idx){
var card=document.createElement("div");
card.className="card";
card.innerHTML='<p class="pname">'+p.name+'</p><p class="psub">Pauta actual: '+p.current+'/mes</p><p class="hint">Arrastra las líneas para ajustar la distribución</p><div class="pct-display" id="pcts-'+idx+'"></div><div class="sbar-wrap" id="bar-'+idx+'"><div class="sbar-seg" id="s0-'+idx+'" style="background:'+C.g+';border-radius:6px 0 0 6px"></div><div class="sbar-seg" id="s1-'+idx+'" style="background:'+C.m+'"></div><div class="sbar-seg" id="s2-'+idx+'" style="background:'+C.l+'"></div><div class="sbar-seg" id="s3-'+idx+'" style="background:'+C.r+';border-radius:0 6px 6px 0"></div><div class="handle" id="h0-'+idx+'"></div><div class="handle" id="h1-'+idx+'"></div><div class="handle" id="h2-'+idx+'"></div></div><div id="table-'+idx+'" style="margin-top:12px"></div>';
container.appendChild(card);

var barEl=document.getElementById("bar-"+idx);
var segs=[document.getElementById("s0-"+idx),document.getElementById("s1-"+idx),document.getElementById("s2-"+idx),document.getElementById("s3-"+idx)];
var handles=[document.getElementById("h0-"+idx),document.getElementById("h1-"+idx),document.getElementById("h2-"+idx)];
var pctsEl=document.getElementById("pcts-"+idx);
var tableEl=document.getElementById("table-"+idx);
var labels=["Google","Meta","LPs GHL","RMK"];
var colors=[CT.g,CT.m,CT.l,CT.r];
var dotColors=[C.g,C.m,C.l,C.r];

function render(){
var pc=p.pcts;
var pos=0;
for(var i=0;i<4;i++){
segs[i].style.left=pos+"%";
segs[i].style.width=pc[i]+"%";
segs[i].textContent=pc[i]>=8?pc[i]+"%":"";
pos+=pc[i];
}
var cumul=0;
for(var i=0;i<3;i++){
cumul+=pc[i];
handles[i].style.left="calc("+cumul+"% - 2px)";
}
var phtml="";
for(var i=0;i<4;i++){
phtml+='<div class="pct-item"><span class="ldot" style="background:'+dotColors[i]+'"></span>'+labels[i]+' <span class="pct-val" style="color:'+colors[i]+'">'+pc[i]+'%</span></div>';
}
pctsEl.innerHTML=phtml;

var html='<div class="prow prow-h"><span>Periodo</span><span class="r">Google</span><span class="r">Meta</span><span class="r">LPs GHL</span><span class="r">RMK</span></div>';
p.periods.forEach(function(pr){
var amts=[];
var remain=pr.total;
for(var i=0;i<3;i++){
var a=Math.round(pr.total*pc[i]/100);
amts.push(a);
remain-=a;
}
amts.push(remain);
html+='<div class="prow"><span>'+pr.label+' <span style="color:var(--color-text-secondary);font-size:11px">('+fmt(pr.total)+')</span></span>';
for(var i=0;i<4;i++){
html+='<span class="r" style="color:'+colors[i]+'">'+fmt(amts[i])+'</span>';
}
html+='</div>';
});
tableEl.innerHTML=html;
}

function startDrag(hIdx,e){
e.preventDefault();
var rect=barEl.getBoundingClientRect();
var w=rect.width;
function onMove(ev){
var clientX=ev.touches?ev.touches[0].clientX:ev.clientX;
var rawPct=Math.round(((clientX-rect.left)/w)*100);
var cumBefore=0;
for(var i=0;i<hIdx;i++) cumBefore+=p.pcts[i];
var cumAfter=0;
for(var i=hIdx+2;i<4;i++) cumAfter+=p.pcts[i];
var minPos=cumBefore+MIN;
var maxPos=100-cumAfter-MIN;
rawPct=Math.max(minPos,Math.min(rawPct,maxPos));
var newLeft=rawPct-cumBefore;
var newRight=(100-cumAfter)-rawPct;
if(newLeft<MIN)newLeft=MIN;
if(newRight<MIN)newRight=MIN;
p.pcts[hIdx]=newLeft;
p.pcts[hIdx+1]=newRight;
render();
}
function onEnd(){
document.removeEventListener("mousemove",onMove);
document.removeEventListener("mouseup",onEnd);
document.removeEventListener("touchmove",onMove);
document.removeEventListener("touchend",onEnd);
}
document.addEventListener("mousemove",onMove);
document.addEventListener("mouseup",onEnd);
document.addEventListener("touchmove",onMove,{passive:false});
document.addEventListener("touchend",onEnd);
}

handles.forEach(function(h,i){
h.addEventListener("mousedown",function(e){startDrag(i,e)});
h.addEventListener("touchstart",function(e){startDrag(i,e)},{passive:false});
});

render();
});
</script>

</body>
</html>
